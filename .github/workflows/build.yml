# File: .github/workflows/build.yml
name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore NetworkChecker.sln

      - name: Publish single-file EXE
        shell: pwsh
        run: |
          dotnet publish src/NetworkChecker/NetworkChecker.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            --output publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetworkChecker-win-x64
          path: publish/NetworkChecker.exe
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/NetworkChecker.exe
          generate_release_notes: true
